const haloMat=new THREE.ShaderMaterial({

scene.add(new THREE.Mesh(new THREE.SphereGeometry(53,64,64),haloMat));

function mkDisk(inner,outer,c1,c2,c3,op,rx){
  const mat=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:0},uIn:{value:inner},uOut:{value:outer},
      uC1:{value:new THREE.Color(c1)},uC2:{value:new THREE.Color(c2)},uC3:{value:new THREE.Color(c3)}},
    vertexShader:`varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`uniform float uTime,uIn,uOut;uniform vec3 uC1,uC2,uC3;varying vec3 vP;
      float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      void main(){
        float r=length(vP.xy);float t=clamp((r-uIn)/(uOut-uIn),0.,1.);
        vec3 c=t<.4?mix(uC1,uC2,t/.4):mix(uC2,uC3,(t-.4)/.6);
        float ang=atan(vP.y,vP.x);float sw=h(vec2(r*.1,ang+uTime*.25))*.22;
        float glow=(1.-t)*(1.-t)*1.1+sw*.25;
        float a=(1.-t)*(1.-t*t)*${op.toFixed(2)}+sw*.08;
        gl_FragColor=vec4(c*glow,clamp(a,0.,1.));
      }`,
    side:THREE.DoubleSide,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false
  });
  const m=new THREE.Mesh(new THREE.RingGeometry(inner,outer,256,8),mat);
  m.rotation.x=rx;scene.add(m);return mat;
}
const dM1=mkDisk(48,165,'#FFFFFF','#FFB8D8','#880044',0.60,Math.PI/2);
const dM2=mkDisk(56,132,'#FFD6E8','#E8508A','#3D001A',0.32,Math.PI/2+0.13);

function mkJet(dir){
  const mat=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:0}},
    vertexShader:`varying vec2 vU;void main(){vU=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`uniform float uTime;varying vec2 vU;
      void main(){
        float f=pow(1.-vU.y,2.)*(1.-vU.x*2.);float p=.6+.28*sin(uTime*3.8+vU.y*9.);
        vec3 c=mix(vec3(1.,.72,.88),vec3(.72,.0,.38),vU.y);
        gl_FragColor=vec4(c*p,f*0.32);
      }`,
    transparent:true,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false
  });
  const m=new THREE.Mesh(new THREE.ConeGeometry(8,225,32,1,true),mat);
  m.position.y=dir*112;m.rotation.x=dir>0?0:Math.PI;scene.add(m);return mat;
}

const pN=300;
const pGeo=new THREE.BufferGeometry(),pBuf=new Float32Array(pN*3),pA=[],pR=[];
for(let i=0;i<pN;i++){

function hXY(t){return{x:16*Math.pow(Math.sin(t),3),y:13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)};}
const hN=isMobile?5000:8000,hP=new Float32Array(hN*3),hC=new Float32Array(hN*3);

function createHintText() {
  const canvasW = 1024;
  const canvasH = 256;
  const canvas = document.createElement('canvas');
  canvas.width = canvasW;
  canvas.height = canvasH;
  const context = canvas.getContext('2d');

  const text = 'Te amo Arleidy ';

  
  const bgGrad = context.createRadialGradient(canvasW/2, canvasH/2, 10, canvasW/2, canvasH/2, canvasW/2.2);
  bgGrad.addColorStop(0, 'rgba(180,0,0,0.6)');
  bgGrad.addColorStop(1, 'rgba(0,0,0,0)');
  context.fillStyle = bgGrad;
  context.fillRect(0, 0, canvasW, canvasH);

  context.font = `bold 120px Georgia, 'Times New Roman', serif`;
  context.textAlign = 'center';
  context.textBaseline = 'middle';

  context.shadowColor = '#8b0000';
  context.shadowBlur = 50;
  context.lineWidth = 8;
  context.strokeStyle = '#cc0000';
  context.strokeText(text, canvasW/2, canvasH/2);

 
  context.shadowColor = '#ff4444';
  context.shadowBlur = 25;
  context.fillStyle = '#ff2020';
  context.fillText(text, canvasW/2, canvasH/2);

  context.shadowColor = 'rgba(255,180,180,0.9)';
  context.shadowBlur = 10;
  context.fillStyle = '#ffffff';
  context.fillText(text, canvasW/2, canvasH/2);

  const textTexture = new THREE.CanvasTexture(canvas);
  textTexture.needsUpdate = true;
  const textMaterial = new THREE.MeshBasicMaterial({ map: textTexture, transparent: true, side: THREE.DoubleSide });
  const planeGeometry = new THREE.PlaneGeometry(28, 7);
  const hintText = new THREE.Mesh(planeGeometry, textMaterial);
  hintText.position.set(0, 20, 0);
  scene.add(hintText);
  return hintText;
}
const sC=[

function mkSpr(txt,cd){
  const cv=document.createElement('canvas');cv.width=1100;cv.height=240;
  const cx=cv.getContext('2d');
  cx.font="bold 105px 'Quicksand',sans-serif";
  // Contorno negro para legibilidad sobre cualquier fondo
  cx.strokeStyle='rgba(0,0,0,0.55)';cx.lineWidth=8;cx.lineJoin='round';
  cx.strokeText(txt,550,122);
  // Sombra rosa
  cx.shadowColor=cd.sh;cx.shadowBlur=28;
  cx.fillStyle=cd.fill;cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText(txt,550,122);
  cx.shadowBlur=10;
  cx.fillText(txt,550,122);
  return new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,blending:THREE.NormalBlending,depthWrite:false}));
}
const tGrp=new THREE.Group();scene.add(tGrp);const sMs=[];
// Escala adaptada: móvil más grande para que se vea bien en pantalla pequeña
const sprW=isMobile?170:145, sprH=isMobile?39:33;
for(let i=0;i<80;i++){

}

// FUNCIÓN PARA CREAR UNA TEXTURA ROSADA CON BORDES REDONDEADOS
function crearTexturaRosada(urlImagen, callback) {
  const canvas = document.createElement('canvas');
  canvas.width = 400;
  canvas.height = 400;
  const ctx = canvas.getContext('2d');

  // Dibujar fondo rosado con esquinas redondeadas
  ctx.fillStyle = '#ffb6c1';
  ctx.beginPath();
  ctx.roundRect(0, 0, canvas.width, canvas.height, 200);
  ctx.fill();

  if (urlImagen && urlImagen.trim() !== "") {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = urlImagen;
    img.onload = () => {
      ctx.save();
      ctx.beginPath();
      ctx.roundRect(0, 0, canvas.width, canvas.height, 200);
      ctx.clip();
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      ctx.restore();
      callback(new THREE.CanvasTexture(canvas));
    };
    img.onerror = () => {
      callback(new THREE.CanvasTexture(canvas)); // Mantiene el rosado si falla el link
    };
  } else {
    callback(new THREE.CanvasTexture(canvas));
  }
}

let textoParticulasMesh;

function crearTextoEnParticulas() {
  // 1. Crear un canvas temporal para dibujar el texto y leer sus píxeles
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 1024;
  canvas.height = 256;

  // 2. Configurar estilo de la fuente del texto
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.font = "bold 90px 'Cormorant Garamond', serif";
  ctx.fillStyle = "#ffffff";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("¡FELIZ ANIVERSARIO!", canvas.width / 2, canvas.height / 2);

  // 3. Obtener los datos de los píxeles del texto
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const pixels = imgData.data;
  const posicionesTemp = [];

  // 4. Escanear los píxeles y guardar las coordenadas donde haya texto visible
  // Incrementamos el paso (j += 3 o 4) para controlar la densidad de partículas
  const salto = isMobile ? 5 : 3; 
  for (let y = 0; y < canvas.height; y += salto) {
    for (let x = 0; x < canvas.width; x += salto) {
      const index = (y * canvas.width + x) * 4;
      const alpha = pixels[index + 3]; // Canal alfa (opacidad del píxel)

      if (alpha > 128) {
        // Centrar y escalar las coordenadas en el espacio 3D de la escena
        const posX = (x - canvas.width / 2) * 0.55;
        const posY = -(y - canvas.height / 2) * 0.55;
        const posZ = (Math.random() - 0.5) * 10; // Ligera profundidad en 3D
        posicionesTemp.push(posX, posY, posZ);
      }
    }
  }

  // 5. Crear la geometría de partículas de Three.js
  const geometriaTexto = new THREE.BufferGeometry();
  const posicionesArray = new Float32Array(posicionesTemp);
  geometriaTexto.setAttribute('position', new THREE.BufferAttribute(posicionesArray, 3));

  // 6. Asignar material brillante estilo estelar (additive blending)
  const materialTexto = new THREE.PointsMaterial({
    size: isMobile ? 2.2 : 1.8,
    color: 0xffd6ec, // Tono rosado estelar suave
    blending: THREE.AdditiveBlending,
    transparent: true,
    opacity: 0.90,
    depthWrite: false
  });

  textoParticulasMesh = new THREE.Points(geometriaTexto, materialTexto);
  
  // 7. Posicionar el texto arriba del centro de la galaxia/planeta
  textoParticulasMesh.position.set(0, isMobile ? 180 : 220, 0);
  scene.add(textoParticulasMesh);
}

// 2. Función para reiniciar la posición y velocidad de un cometa de forma aleatoria
function reiniciarCometa(mesh) {
  mesh.position.set(
    (Math.random() - 0.5) * 800,
    Math.random() * 400 + 100,
    (Math.random() - 0.5) * 800
  );
  // Velocidad de desplazamiento en los ejes X, Y, Z
  mesh.userData.velocidad = {
    x: (Math.random() - 0.5) * 40 - 6,
    y: -Math.random() * 40 - 2,
    z: (Math.random() - 0.5) * 4
  };
}

// 3. Generar la geometría y material de cada cometa
for (let i = 0; i < cantidadCometas; i++) {
  // Una línea corta que simula la estela del cometa
  const puntosCometa = [
    new THREE.Vector3(0, 0, 0),
    new THREE.Vector3(-15, 5, 0) // Longitud de la estela
  ];
  
  const geometriaCometa = new THREE.BufferGeometry().setFromPoints(puntosCometa);
  const materialCometa = new THREE.LineBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending
  });

  const cometaMesh = new THREE.Line(geometriaCometa, materialCometa);
  reiniciarCometa(cometaMesh);
  
  grupoCometas.add(cometaMesh);
  cometasData.push(cometaMesh);

  
}

/* DESTELLOS DE CLIC CON LÍMITE DE FRECUENCIA */
/* ========================================== */

const destellosClickGrupo = new THREE.Group();
scene.add(destellosClickGrupo);

let ultimoToqueTiempo = 0;
const intervaloMinimo = 10500; // Milisegundos de espera entre cada destello permitido

window.addEventListener('pointerdown', (e) => {
  // Ignorar si se hace clic en el modal o botones
  if (e.target.closest('#MODAL-FLOTANTE') || e.target.closest('button')) return;

  const tiempoActual = Date.now();
  
  // Si no ha pasado el tiempo mínimo desde el último toque, cancelamos la ejecución
  if (tiempoActual - ultimoToqueTiempo < intervaloMinimo) return;
  
  ultimoToqueTiempo = tiempoActual; // Actualizamos el registro del último toque

  // Reducimos ligeramente la cantidad de partículas por explosión para mayor fluidez
  const cantidadParticulas = 10;
  const geomRafaga = new THREE.BufferGeometry();
  const posicionesRafaga = [];
  const velocidadesRafaga = [];

  for (let i = 0; i < cantidadParticulas; i++) {
    posicionesRafaga.push(0, 0, 0);
    velocidadesRafaga.push(
      (Math.random() - 0.5) * 4,
      (Math.random() - 0.5) * 4,
      (Math.random() - 0.5) * 4
    );
  }

  geomRafaga.setAttribute('position', new THREE.Float32BufferAttribute(posicionesRafaga, 3));

  const matRafaga = new THREE.PointsMaterial({
    size: 2.5,
    color: 0xffb6c1,
    transparent: true,
    opacity: 1.0,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const ráfagaMesh = new THREE.Points(geomRafaga, matRafaga);
  
  ráfagaMesh.position.set(
    (Math.random() - 0.5) * 50,
    (Math.random() - 0.5) * 50,
    0
  );

  destellosClickGrupo.add(ráfagaMesh);

  let vida = 30; // Reducido a 30 fotogramas para limpiar la memoria más rápido
  const animarRafaga = () => {
    vida--;
    const posArr = ráfagaMesh.geometry.attributes.position.array;
    for (let i = 0; i < cantidadParticulas; i++) {
      posArr[i * 3] += velocidadesRafaga[i * 3];
      posArr[i * 3 + 1] += velocidadesRafaga[i * 3 + 1];
      posArr[i * 3 + 2] += velocidadesRafaga[i * 3 + 2];
    }
    ráfagaMesh.geometry.attributes.position.needsUpdate = true;
    matRafaga.opacity = vida / 30;

    if (vida > 0) {
      requestAnimationFrame(animarRafaga);
    } else {
      destellosClickGrupo.remove(ráfagaMesh);
      geomRafaga.dispose();
      matRafaga.dispose();
    }
  };
  animarRafaga();
});

    
}

  
  
loop();
